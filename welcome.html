<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Family | Apex Learning</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --c-accent: #a2eef2; --c-bg: #0a0a0a; }
        body { background: var(--c-bg); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .wizard-card { width: 100%; max-width: 500px; padding: 40px; background: rgba(255,255,255,0.02); border: 1px solid rgba(162,238,242,0.1); border-radius: 24px; position: relative; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s ease; }
        .progress-dots { display: flex; gap: 10px; margin-bottom: 30px; }
        .dot { height: 4px; flex: 1; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .dot.active { background: var(--c-accent); }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: var(--c-accent); }
        label { display: block; margin: 20px 0 8px; font-size: 0.9rem; opacity: 0.8; }
        input, select, textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; box-sizing: border-box; }
        .btn-group { margin-top: 30px; display: flex; gap: 15px; }
        .btn-next { background: var(--c-accent); color: black; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 2; }
        .btn-prev { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 24px; border-radius: 8px; cursor: pointer; flex: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        select option { background-color: #0a0a0a; color: #ffffff; }
        
        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }
        .check-item { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; }
        .check-item input[type="checkbox"] { accent-color: var(--c-accent); }
    </style>
</head>
<body>

<div class="wizard-card">
    <div class="progress-dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <form id="welcomeWizard">
        <div class="step active" id="step1">
            <h1>Step 1: The Student</h1>
            <label>Student's Full Name</label>
            <input type="text" name="student_name" required>
            
            <label>Student/Parent Email</label>
            <input type="email" name="student_email" required placeholder="For login credentials">
            
            <label>Current Grade/Year Level</label>
            <input type="text" name="grade" required>
            
            <label>Curriculum</label>
            <select name="curriculum" required>
                <option value="" disabled selected>Select Curriculum</option>
                <option value="British">British (IGCSE/GCSE/A-Level)</option>
                <option value="American">American (Common Core/AP)</option>
                <option value="IB">International Baccalaureate (IB)</option>
                <option value="Ministry">Ministry (Kuwait)</option>
            </select>
            <div class="btn-group">
                <button type="button" class="btn-next" onclick="nextStep(2)">Next</button>
            </div>
        </div>

        <div class="step" id="step2">
            <h1>Step 2: Learning Goals</h1>
            <label>Primary Focus</label>
            <select name="goal" required>
                <option value="" disabled selected>Select your goal</option>
                <option value="exam_prep">Exam Preparation</option>
                <option value="general_support">General Academic Support</option>
            </select>
            <label>Specific Struggles</label>
            <textarea name="struggles" rows="3"></textarea>
            <div class="btn-group">
                <button type="button" class="btn-prev" onclick="nextStep(1)">Back</button>
                <button type="button" class="btn-next" onclick="nextStep(3)">Next</button>
            </div>
        </div>

        <div class="step" id="step3">
            <h1>Step 3: Availability</h1>
            <div class="schedule-grid">
                <label class="check-item"><input type="checkbox" name="availability" value="Mon 3-6pm"> Mon 3-6pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Mon 6-9pm"> Mon 6-9pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Tue 3-6pm"> Tue 3-6pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Tue 6-9pm"> Tue 6-9pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Wed 3-6pm"> Wed 3-6pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Wed 6-9pm"> Wed 6-9pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Thu 3-6pm"> Thu 3-6pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Thu 6-9pm"> Thu 6-9pm</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Fri Any"> Fri Any</label>
                <label class="check-item"><input type="checkbox" name="availability" value="Sat Any"> Sat Any</label>
            </div>
            <label style="margin-top: 20px;">Contact Method</label>
            <select name="contact_pref" required>
                <option value="whatsapp">WhatsApp</option>
                <option value="email">Email</option>
            </select>
            <div class="btn-group">
                <button type="button" class="btn-prev" onclick="nextStep(2)">Back</button>
                <button type="button" class="btn-next" onclick="nextStep(4)">Next</button>
            </div>
        </div>

        <div class="step" id="step4">
            <h1>Step 4: Finalize Account</h1>
            <label>Create Password</label>
            <input type="password" name="password" required>
            <div class="btn-group">
                <button type="button" class="btn-prev" onclick="nextStep(3)">Back</button>
                <button type="submit" class="btn-next">Finish & Access Portal</button>
            </div>
        </div>
    </form>
</div>

<script>
    // FIX: The missing nextStep function
    function nextStep(stepNumber) {
        // Hide all steps
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        // Show target step
        document.getElementById('step' + stepNumber).classList.add('active');
        // Update dots
        document.querySelectorAll('.dot').forEach((d, i) => {
            if(i < stepNumber) d.classList.add('active');
            else d.classList.remove('active');
        });
    }

    document.getElementById('welcomeWizard').onsubmit = function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const studentName = this.student_name.value;
        const studentEmail = this.student_email.value;
        
        btn.innerText = "Finalizing Account...";
        btn.disabled = true;

        const formData = new FormData(this);
        const selectedDays = Array.from(document.querySelectorAll('input[name="availability"]:checked'))
                                  .map(cb => cb.value).join(', ');
        
        formData.set('timing', selectedDays);
        formData.append('form_type', 'profile_setup');

        fetch('https://script.google.com/macros/s/AKfycbyxHMO0OCg8Qe2uZVJnP99ZFvLRDGKgPcwU4EP50bOLnbXATqMC1tEBX6-JhPQRieix/exec', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.result === "success") {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('studentName', studentName);
                alert("Success! Your credentials have been emailed to: " + studentEmail);
                window.location.href = "portal.html"; 
            }
        })
        .catch(err => {
            alert("Submission error. Please check your internet connection.");
            btn.disabled = false;
            btn.innerText = "Finish & Access Portal";
        });
    };
</script>

</body>
</html>
