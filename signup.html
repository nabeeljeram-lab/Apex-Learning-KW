<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Dossier | Apex Learning</title>
    <style>
        :root {
            --c-midnight: #0A192F;
            --c-steel: #36454F;
            --ocean-gradient: linear-gradient(180deg, #004e92 0%, #000428 100%);
        }

        body {
            background-color: #1a1a1a; /* Deep matte background */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .dossier-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 8px;
        }

        /* SOLID WHITE POWER TITLES */
        h1 {
            color: #ffffff !important;
            font-weight: 800 !important;
            letter-spacing: -0.02em !important;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: left;
        }

        .subtitle {
            color: #ffffff;
            opacity: 0.7;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 4px;
            font-size: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: var(--ocean-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="dossier-container">
        <h1>Enrollment Dossier</h1>
        <span class="subtitle">Institutional Onboarding</span>

        <form id="onboardingForm">
            <div class="form-group">
                <label>Parent/Guardian Full Name</label>
                <input type="text" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Student Full Name</label>
                <input type="text" required placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label>Contact Email</label>
                <input type="email" required placeholder="Email for secure reports">
            </div>

            <div class="form-group">
                <label>Selected Academic Plan</label>
                <select id="planDisplay" disabled>
                    <option value="">Detecting selection...</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Proceed to Secure Payment</button>
        </form>
    </div>

    <script>
        // Logic to detect the plan from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const planPrice = urlParams.get('plan');
        const planDisplay = document.getElementById('planDisplay');

        if (planPrice) {
            planDisplay.innerHTML = `<option>${planPrice} KD Plan Selected</option>`;
        }
    </script>
</body>
</html>
