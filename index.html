<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Learning | Coming Soon</title>
    <style>
        :root {
            /* The official Apex brand colors */
            --c-bg: #0f172a; 
            --c-text: #f8fafc;
            --c-accent: #A2EEF2; 
        }
        
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--c-bg);
            color: var(--c-text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(162, 238, 242, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        h1 span {
            color: var(--c-accent);
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .contact-box {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 30px;
        }

        .contact-box h3 {
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .contact-item {
            margin: 18px 0;
            font-size: 1.05rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .contact-item strong {
            color: var(--c-accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        a {
            color: var(--c-text);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        a:hover {
            color: var(--c-accent);
        }

        /* Small animation for the page load */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="fade-in">
    <div class="container">
        <h1>Apex <span>Learning</span></h1>
        
        <p class="subtitle">
            Our world-class digital ecosystem is currently under construction. 
            We are preparing an unparalleled curriculum and portal experience for our students. We will be live shortly.
        </p>
        
        <div class="contact-box">
            <h3>Contact Us</h3>
            
            <div class="contact-item">
                <strong>Email</strong> 
                <a href="mailto:info@apexlearningkw.com">info@apexlearningkw.com</a>
            </div>
            
            <div class="contact-item">
                <strong>WhatsApp / Phone</strong> 
                <a href="tel:+96500000000">+965 9876 1113</a> 
            </div>
            
          
        </div>
    </div>
</body>
</html>
